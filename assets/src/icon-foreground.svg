<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Motivo centrato nella safe-zone adattiva (~centro 66%).
       Fotocopia grezza (dietro) → pagina pulita con margine ampio per
       annotazioni (davanti), accento teal. -->
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5fd6cf"/>
      <stop offset="100%" stop-color="#3fb9c9"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#sh)">
    <!-- Pagina "prima": scansione storta e sbiadita -->
    <g transform="rotate(-9 512 512)">
      <rect x="316" y="300" width="360" height="452" rx="20" fill="#3a3f4b"/>
      <rect x="356" y="356" width="240" height="20" rx="10" fill="#565c6b"/>
      <rect x="356" y="404" width="280" height="14" rx="7" fill="#4a505e"/>
      <rect x="356" y="436" width="280" height="14" rx="7" fill="#4a505e"/>
      <rect x="356" y="468" width="220" height="14" rx="7" fill="#4a505e"/>
    </g>

    <!-- Pagina "dopo": pulita, con margine destro per le annotazioni -->
    <g transform="rotate(5 512 512)">
      <rect x="352" y="288" width="376" height="470" rx="22" fill="#f4f1ea"/>
      <!-- Titolo (sans) -->
      <rect x="392" y="340" width="196" height="30" rx="8" fill="url(#teal)"/>
      <!-- Corpo (serif) -->
      <rect x="392" y="398" width="200" height="13" rx="6.5" fill="#2b2f38"/>
      <rect x="392" y="428" width="200" height="13" rx="6.5" fill="#2b2f38"/>
      <rect x="392" y="458" width="176" height="13" rx="6.5" fill="#2b2f38"/>
      <rect x="392" y="500" width="200" height="13" rx="6.5" fill="#2b2f38"/>
      <rect x="392" y="530" width="150" height="13" rx="6.5" fill="#2b2f38"/>
      <!-- Margine ampio per annotazioni (linea tratteggiata teal) -->
      <line x1="620" y1="330" x2="620" y2="716" stroke="url(#teal)" stroke-width="4"
            stroke-dasharray="10 12" stroke-linecap="round"/>
      <!-- Nota a margine -->
      <rect x="644" y="404" width="52" height="9" rx="4.5" fill="#3fb9c9" opacity="0.85"/>
      <rect x="644" y="424" width="40" height="9" rx="4.5" fill="#3fb9c9" opacity="0.6"/>
    </g>
  </g>

  <!-- Scintilla di "digitalizzazione" -->
  <g fill="url(#teal)" transform="translate(690 300)">
    <path d="M0 -34 L9 -9 L34 0 L9 9 L0 34 L-9 9 L-34 0 L-9 -9 Z"/>
  </g>
</svg>
