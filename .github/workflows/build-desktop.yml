name: Build app desktop (Mac + Windows)

# Compila l'app desktop Electron per macOS e Windows. A differenza della
# webapp su Pages, l'app desktop fa funzionare ANCHE i modelli NVIDIA: come
# CapacitorHttp su Android, il processo Electron inietta gli header CORS
# mancanti, quindi OCR ed engine NVIDIA non sono bloccati dal browser.
#
# Avvio: manuale dalla tab "Actions" → "Run workflow", oppure creando un tag
# di versione (es. git tag v0.1.0 && git push --tags). Gli installabili
# compaiono fra le Releases del repository (build-N) e come "Artifacts"
# del run (Mac: .dmg/.zip · Windows: .exe). Ogni
# runner scarica lo stesso Typst 0.15.1 per la propria piattaforma/architettura.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm test` è volutamente senza percorsi. Un glob (`tests/*.test.js`) lo
      # espande la shell, e cmd.exe non lo fa: è così che questo passo si era
      # rotto sul runner Windows. Ma passare la cartella non è la soluzione —
      # verificato su entrambe le versioni:
      #
      #   forma                          Node 20    Node 22
      #   nessun argomento                 ok         ok
      #   `tests` (cartella)               ok       fallisce
      #   `tests/*.test.js` non espanso  fallisce     ok
      #
      # Node 22 ha sostituito il supporto alla cartella con l'espansione dei
      # glob. Senza argomenti il test runner cerca da sé i file dalla cartella
      # corrente, ed è l'unica forma che regge ovunque.
      - name: Test JavaScript
        run: npm test

      - name: Download Typst native compiler
        run: npm run download:typst

      - name: Test native Typst engine
        run: npm run test:native-engine

      - name: Build webapp (Vite)
        run: npm run build

      # Firma e notarizzazione Apple: si attivano da sole quando nei Secrets
      # del repository ci sono MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD,
      # APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD e APPLE_TEAM_ID (serve l'Apple
      # Developer Program). Senza, l'app esce non firmata come prima.
      - name: Build desktop (electron-builder)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$CSC_LINK" ]; then
            echo "Firma con Developer ID e notarizzazione Apple."
            npx electron-builder --publish never -c.mac.notarize=true
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset CSC_LINK CSC_KEY_PASSWORD
            npx electron-builder --publish never
          fi
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installabili
        uses: actions/upload-artifact@v4
        with:
          name: scanconverter-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe

      # Download diretto e veloce: una pre-release del repository per ogni
      # build, con i file già pronti (niente zip degli Artifacts, niente
      # servizi esterni che rispondono con errore 500).
      - name: Pubblica la build fra le Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }} (${{ github.ref_name }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            release/*.dmg
            release/*.exe
