      THESIS: ScanConverter è un banco editoriale, non una dashboard di card; il documento e il suo passaggio da scansione a pagina pulita guidano la superficie.

      FIRST VIEWPORT: wordmark e stato in una barra sottile; titolo ampio, sessioni e ingresso del documento compongono un unico banco, con importazione sempre visibile.
